info:
  name: login
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "test@test.com",
        "password": "111111"
      }
  auth: inherit

runtime:
  variables:
    - name: base_url
      value: http://127.0.0.1:8080/api/v1
  scripts:
    - type: after-response
      code: bru.setEnvVar("token", res.body.data.token);
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.token
        method: jsonq
      variable:
        name: token
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
