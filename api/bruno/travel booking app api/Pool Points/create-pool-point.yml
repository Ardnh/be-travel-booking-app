info:
  name: Create Pool Point
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/pool-points"
  body:
    type: json
    data: |-
      {
        "name": "Pool Point Name",
        "slug": "pool-slug",
        "address": "Pool address",
        "city": "City",
        "province": "Province",
        "latitude": -6.2088,
        "longitude": 106.8456,
        "open_time": "08:00",
        "close_time": "18:00",
        "status": "active",
        "vendor_id": "b699db7b-a668-4d32-9e0b-e3dde04de6d2",
        "description": "Pool point description"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
