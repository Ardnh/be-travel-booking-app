info:
  name: Create Layout Position
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/api/v1/layouts/:layoutId/layout-positions"
  body:
    type: json
    data: |-
      {
        "label": "A1",
        "row": 1,
        "col": 1,
        "positionType": "seat"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5