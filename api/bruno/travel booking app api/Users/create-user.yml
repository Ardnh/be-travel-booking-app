info:
  name: Create User
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/v1/users"
  body:
    type: json
    data: |-
      {
        "name": "User Name",
        "email": "user@example.com",
        "password": "password123",
        "phone": "08123456789"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5