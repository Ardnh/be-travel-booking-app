info:
  name: Create Layout
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/api/v1/layouts"
  body:
    type: json
    data: |-
      {
        "name": "Layout Name",
        "gridSizeX": 10,
        "gridSizeY": 5,
        "seatCount": 50,
        "createdBy": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5